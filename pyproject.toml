[project]
name = "bong"
version = "0.2.0"
description = "Bong, a protogen Discord chat bot"
requires-python = ">=3.10"
dependencies = [
    "discord.py[voice]>=2.7",
    "davey>=0.1",
    "yt-dlp",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "chromadb==1.5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
bong = "bong.__main__:main"

[tool.setuptools.packages.find]
include = ["bong*"]

[tool.setuptools.package-data]
"bong.persona" = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
